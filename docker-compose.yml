services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pgqueue
      POSTGRES_PASSWORD: pgqueue
      POSTGRES_DB: pgqueue
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgqueue"]
      interval: 2s
      timeout: 2s
      retries: 15
